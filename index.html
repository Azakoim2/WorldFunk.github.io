<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldle – WorldFunk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="left-group">
        <button class="lang-pill" type="button" aria-label="Język">
          <span class="flag">PL</span>
        </button>
        <button class="plus-btn" type="button" aria-label="Nowa gra">+</button>
      </div>

      <div class="right-group">
        <button class="icon-btn" type="button" aria-label="Statystyki">
          <!-- simple bar chart icon -->
          <svg width="18" height="14" viewBox="0 0 18 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="0.5" y="7" width="2.5" height="6" rx="0.5" fill="currentColor"/>
            <rect x="5.5" y="3" width="2.5" height="10" rx="0.5" fill="currentColor"/>
            <rect x="10.5" y="0.5" width="2.5" height="12.5" rx="0.5" fill="currentColor"/>
            <rect x="15.5" y="5" width="2.5" height="7" rx="0.5" fill="currentColor"/>
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Ustawienia">
          <!-- gear icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" fill="currentColor"/>
            <path d="M19.4 12.94a7.2 7.2 0 0 0 0-1.88l2.11-1.65a0.5 0.5 0 0 0 .12-0.63l-2-3.46a0.5 0.5 0 0 0-.6-0.22l-2.49 1a7.3 7.3 0 0 0-1.62-.94L14.5 2.5a0.5 0.5 0 0 0-.5-0.5h-4a0.5 0.5 0 0 0-.[...]
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Pomoc">
          <!-- question mark icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 18h.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.09 9a3 3 0 1 1 5.82 1c0 2-3 3-3 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="game-shell">
      <div id="board" class="board" aria-label="Plansza gry"></div>

      <div class="keyboard" aria-label="Klawiatura">
        <div class="keyboard-row">
          <button class="key">Q</button>
          <button class="key">W</button>
          <button class="key">E</button>
          <button class="key">R</button>
          <button class="key">T</button>
          <button class="key">Y</button>
          <button class="key">U</button>
          <button class="key">I</button>
          <button class="key">O</button>
          <button class="key">P</button>
        </div>

        <div class="keyboard-row">
          <button class="key">A</button>
          <button class="key">S</button>
          <button class="key">D</button>
          <button class="key">F</button>
          <button class="key">G</button>
          <button class="key">H</button>
          <button class="key">J</button>
          <button class="key">K</button>
          <button class="key">L</button>
        </div>

        <div class="keyboard-row">
          <button class="key backspace">⌫</button>
          <button class="key">Z</button>
          <button class="key">X</button>
          <button class="key">C</button>
          <button class="key">V</button>
          <button class="key">B</button>
          <button class="key">N</button>
          <button class="key">M</button>
          <button class="key enter">Enter</button>
        </div>

        <div class="keyboard-row extra-row">
          <button class="key extra">Ą</button>
          <button class="key extra">Ć</button>
          <button class="key extra">Ę</button>
          <button class="key extra">Ł</button>
          <button class="key extra">Ń</button>
          <button class="key extra">Ó</button>
          <button class="key extra">Ś</button>
          <button class="key extra">Ź</button>
          <button class="key extra">Ż</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
