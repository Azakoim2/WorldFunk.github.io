<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Worldle – WorldFunk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="left">
        <button class="lang-pill">PL</button>
        <button class="circle-btn" aria-label="Nowa gra">+</button>
      </div>
      <div class="right">
        <button class="icon-btn" aria-label="Statystyki">▤</button>
        <button class="icon-btn" aria-label="Ustawienia">⚙</button>
        <button class="icon-btn" aria-label="Pomoc">?</button>
      </div>
    </div>

    <main class="container">
      <div id="board" class="board" aria-label="Plansza gry"></div>

      <div class="keyboard" aria-label="Klawiatura">
        <div class="row">
          <button class="key">Q</button>
          <button class="key">W</button>
          <button class="key">E</button>
          <button class="key">R</button>
          <button class="key">T</button>
          <button class="key">Y</button>
          <button class="key">U</button>
          <button class="key">I</button>
          <button class="key">O</button>
          <button class="key">P</button>
        </div>
        <div class="row">
          <button class="key">A</button>
          <button class="key">S</button>
          <button class="key">D</button>
          <button class="key">F</button>
          <button class="key">G</button>
          <button class="key">H</button>
          <button class="key">J</button>
          <button class="key">K</button>
          <button class="key">L</button>
        </div>
        <div class="row">
          <button class="key wide">⌫</button>
          <button class="key">Z</button>
          <button class="key">X</button>
          <button class="key">C</button>
          <button class="key">V</button>
          <button class="key">B</button>
          <button class="key">N</button>
          <button class="key">M</button>
          <button class="key enter">Enter</button>
        </div>
        <div class="row small-row">
          <button class="key small">Ą</button>
          <button class="key small">Ć</button>
          <button class="key small">Ę</button>
          <button class="key small">Ł</button>
          <button class="key small">Ń</button>
          <button class="key small">Ó</button>
          <button class="key small">Ś</button>
          <button class="key small">Ź</button>
          <button class="key small">Ż</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
