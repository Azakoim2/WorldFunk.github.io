<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Funk – 5 liter</title>
  <style>
    :root {
      --bg: #121213;
      --tile-border: #3a3a3c;
      --tile-border-filled: #565758;
      --correct: #6aaa64;
      --present: #c9b458;
      --absent: #3a3a3c;
      --key-bg: #818384;
      --key-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 12px 0 20px;
      letter-spacing: 2px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 20px;
    }

    .row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .tile {
      width: 56px;
      height: 56px;
      border: 2px solid var(--tile-border);
      border-radius: 8px;
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .tile.filled { border-color: var(--tile-border-filled); }
    .tile.correct { background: var(--correct); border-color: var(--correct); }
    .tile.present { background: var(--present); border-color: var(--present); }
    .tile.absent  { background: var(--absent);  border-color: var(--absent); }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 520px;
      width: 100%;
      margin-bottom: 20px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key {
      height: 52px;
      min-width: 38px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--key-bg);
      color: var(--key-text);
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .key.wide { min-width: 62px; font-size: 0.75rem; }
    .key.correct { background: var(--correct); }
    .key.present { background: var(--present); }
    .key.absent  { background: var(--absent); }

    .message {
      margin-bottom: 15px;
      font-size: 1.1rem;
      height: 28px;
      text-align: center;
      color: #ff6b6b;
      font-weight: bold;
    }

    /* Styl okienka modalnego */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-content {
      background-color: #1f1f23;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #3a3a3c;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 15px;
      color: white;
    }

    .modal-subtitle {
      font-size: 0.95rem;
      color: #b0b0b0;
      margin-bottom: 12px;
    }

    .secret-word-box {
      display: inline-block;
      background: #121213;
      border: 2px dashed #565758;
      padding: 10px 20px;
      font-size: 1.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      border-radius: 8px;
      color: white;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .restart-btn {
      background-color: var(--correct);
      color: white;
      border: none;
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.2s;
    }

    .restart-btn:hover {
      background-color: #538d4e;
    }

    .modal-hint {
      font-size: 0.8rem;
      color: #818384;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <h1>WORD FUNK</h1>

  <div class="board" id="board"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="message" id="message">Ładowanie słownika...</div>

  <!-- Okienko modalne -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Przegrałeś!</div>
      <div class="modal-subtitle">Odpowiedź brzmiała:</div>
      <div class="secret-word-box" id="modalSecretWord">ZAIKS</div>
      <button class="restart-btn" onclick="resetGame()">Jeszcze raz</button>
      <div class="modal-hint">lub naciśnij Enter, aby zagrać ponownie</div>
    </div>
  </div>

  <script>
    let WORDS = [];
    let VALID_WORDS = new Set();
    let secret = "";
    let secretNorm = "";

    let currentRow = 0;
    let currentTile = 0;
    let gameOver = true;
    let board = Array(6).fill().map(() => Array(5).fill("")); // 6 wierszy, 5 kolumn

    const keyElements = {};

    function normalize(str) {
      return str.toLowerCase()
        .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e")
        .replace(/ł/g,"l").replace(/ń/g,"n").replace(/ó/g,"o")
        .replace(/ś/g,"s").replace(/ź/g,"z").replace(/ż/g,"z");
    }

    async function initGame() {
      try {
        const response = await fetch('words.json');
        if (!response.ok) throw new Error("Nie udało się pobrać pliku ze słowami.");
        
        const rawWords = await response.json();
        // Filtrujemy tylko słowa o długości dokładnie 5 liter
        WORDS = rawWords.filter(w => w.trim().length === 5);
        
        if (!WORDS || WORDS.length === 0) throw new Error("Brak 5-literowych słów w słowniku!");

        VALID_WORDS = new Set(WORDS.map(w => normalize(w)));
        resetGame();

      } catch (error) {
        console.error(error);
        document.getElementById("message").textContent = "Błąd ładowania słownika (wymagane słowa 5-literowe)!";
      }
    }

    function resetGame() {
      if (WORDS.length === 0) return;

      secret = WORDS[Math.floor(Math.random() * WORDS.length)];
      secretNorm = normalize(secret);

      currentRow = 0;
      currentTile = 0;
      gameOver = false;
      board = Array(6).fill().map(() => Array(5).fill(""));

      document.getElementById("message").textContent = "";
      document.getElementById("modalOverlay").style.display = "none";

      for (let r = 0; r < 6; r++) {
        for (let c = 0; c < 5; c++) {
          const tile = document.getElementById(`tile-${r}-${c}`);
          tile.textContent = "";
          tile.className = "tile";
        }
      }

      Object.values(keyElements).forEach(key => {
        const k = key.dataset.key;
        key.className = "key" + (k === "Enter" || k === "←" ? " wide" : "");
      });
    }

    // Tworzenie planszy 6x5
    const boardEl = document.getElementById("board");
    for (let r = 0; r < 6; r++) {
      const row = document.createElement("div");
      row.className = "row";
      for (let c = 0; c < 5; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = `tile-${r}-${c}`;
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }

    // Klawiatura
    const keyboardLayout = [
      ["q","w","e","r","t","y","u","i","o","p"],
      ["a","s","d","f","g","h","j","k","l"],
      ["Enter","z","x","c","v","b","n","m","←"],
      ["ą","ć","ę","ł","ń","ó","ś","ź","ż"]
    ];

    const keyboardEl = document.getElementById("keyboard");
    keyboardLayout.forEach(rowKeys => {
      const row = document.createElement("div");
      row.className = "keyboard-row";
      rowKeys.forEach(k => {
        const key = document.createElement("button");
        key.className = "key" + (k === "Enter" || k === "←" ? " wide" : "");
        key.textContent = k === "←" ? "⌫" : k;
        key.dataset.key = k;
        key.addEventListener("click", () => handleKey(k));
        row.appendChild(key);
        keyElements[k] = key;
      });
      keyboardEl.appendChild(row);
    });

    function handleKey(key) {
      if (gameOver) {
        if (key === "Enter") resetGame();
        return;
      }

      if (key === "Enter") {
        submitGuess();
      } else if (key === "←") {
        deleteLetter();
      } else if (currentTile < 5) {
        addLetter(key);
      }
    }

    function addLetter(letter) {
      if (currentTile >= 5) return;
      board[currentRow][currentTile] = letter;
      const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
      tile.textContent = letter;
      tile.classList.add("filled");
      currentTile++;
    }

    function deleteLetter() {
      if (currentTile === 0) return;
      currentTile--;
      board[currentRow][currentTile] = "";
      const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
      tile.textContent = "";
      tile.classList.remove("filled");
    }

    function submitGuess() {
      if (currentTile < 5) {
        showMessage("Za mało liter!");
        return;
      }

      const guess = board[currentRow].join("");
      const guessNorm = normalize(guess);

      if (!VALID_WORDS.has(guessNorm)) {
        showMessage("Słowo nie istnieje w słowniku!");
        return;
      }

      const secretArr = secretNorm.split("");
      const guessArr = guessNorm.split("");
      const result = Array(5).fill("absent");
      const usedSecret = Array(5).fill(false);

      for (let i = 0; i < 5; i++) {
        if (guessArr[i] === secretArr[i]) {
          result[i] = "correct";
          usedSecret[i] = true;
          guessArr[i] = null;
        }
      }

      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;
        const letter = guessArr[i];
        if (letter === null) continue;

        let foundMatch = false;
        for (let j = 0; j < 5; j++) {
          if (!usedSecret[j] && secretArr[j] === letter) {
            foundMatch = true;
            usedSecret[j] = true;
            break;
          }
        }
        if (foundMatch) {
          result[i] = "present";
        }
      }

      for (let i = 0; i < 5; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.add(result[i]);

        const originalLetter = board[currentRow][i].toLowerCase();
        const key = keyElements[originalLetter] || keyElements[normalize(originalLetter)];
        if (key) {
          if (result[i] === "correct") {
            key.classList.remove("present", "absent");
            key.classList.add("correct");
          } else if (result[i] === "present" && !key.classList.contains("correct")) {
            key.classList.remove("absent");
            key.classList.add("present");
          } else if (!key.classList.contains("correct") && !key.classList.contains("present")) {
            key.classList.add("absent");
          }
        }
      }

      if (guessNorm === secretNorm) {
        showModal(true);
        return;
      }

      currentRow++;
      currentTile = 0;

      if (currentRow >= 6) {
        showModal(false);
      }
    }

    function showModal(isWin) {
      gameOver = true;
      const modal = document.getElementById("modalOverlay");
      const title = document.getElementById("modalTitle");
      const wordBox = document.getElementById("modalSecretWord");

      if (isWin) {
        title.textContent = "Gratulacje! 🎉";
      } else {
        title.textContent = "Przegrałeś!";
      }

      wordBox.textContent = secret.toUpperCase();
      modal.style.display = "flex";
    }

    function showMessage(text) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      setTimeout(() => {
        if (!gameOver && msg.textContent === text) msg.textContent = "";
      }, 2200);
    }

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      if (key === "enter") handleKey("Enter");
      else if (gameOver) return;
      else if (key === "backspace") handleKey("←");
      else if (/^[a-ząćęłńóśźż]$/.test(key)) handleKey(key);
    });

    initGame();
  </script>
</body>
</html>
