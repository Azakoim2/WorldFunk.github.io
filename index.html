<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldle Mockup</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="left-group">
        <button class="lang-pill" type="button">PL</button>
        <button class="plus-btn" type="button" aria-label="Nowa gra">+</button>
      </div>

      <div class="right-group">
        <button class="icon-btn" type="button" aria-label="Statystyki">▤</button>
        <button class="icon-btn" type="button" aria-label="Ustawienia">⚙</button>
        <button class="icon-btn" type="button" aria-label="Pomoc">?</button>
      </div>
    </div>

    <main class="game-shell">
      <div id="board" class="board" aria-label="Plansza gry"></div>

      <div class="keyboard" aria-label="Klawiatura">
        <div class="key-row">
          <button class="key">Q</button>
          <button class="key">W</button>
          <button class="key">E</button>
          <button class="key">R</button>
          <button class="key">T</button>
          <button class="key">Y</button>
          <button class="key">U</button>
          <button class="key">I</button>
          <button class="key">O</button>
          <button class="key">P</button>
        </div>

        <div class="key-row">
          <button class="key">A</button>
          <button class="key">S</button>
          <button class="key">D</button>
          <button class="key">F</button>
          <button class="key">G</button>
          <button class="key">H</button>
          <button class="key">J</button>
          <button class="key">K</button>
          <button class="key">L</button>
        </div>

        <div class="key-row">
          <button class="key backspace">⌫</button>
          <button class="key">Z</button>
          <button class="key">X</button>
          <button class="key">C</button>
          <button class="key">V</button>
          <button class="key">B</button>
          <button class="key">N</button>
          <button class="key">M</button>
          <button class="key enter">Enter</button>
        </div>

        <div class="key-row extra-row">
          <button class="key extra">Ą</button>
          <button class="key extra">Ć</button>
          <button class="key extra">Ę</button>
          <button class="key extra">Ł</button>
          <button class="key extra">Ń</button>
          <button class="key extra">Ó</button>
          <button class="key extra">Ś</button>
          <button class="key extra">Ź</button>
          <button class="key extra">Ż</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
