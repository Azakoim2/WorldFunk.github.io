<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Worldle – WorldFunk</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="topbar">
      <div class="left-group">
        <button class="lang-pill" type="button" aria-label="Język">
          <span class="flag">PL</span>
        </button>
        <button class="plus-btn" type="button" aria-label="Nowa gra">+</button>
      </div>

      <div class="right-group">
        <button class="icon-btn" type="button" aria-label="Statystyki" title="Statystyki">
          <!-- improved bar-chart icon (feather style) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <line x1="18" y1="20" x2="18" y2="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="12" y1="20" x2="12" y2="4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="6" y1="20" x2="6" y2="14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Ustawienia" title="Ustawienia">
          <!-- improved settings (gear) icon (feather style) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06A2 2 0 1 1 7.3 2.3l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09c.3.1.6.2 1 .2.5.05.9.2 1.3.4l.7-.4a2 2 0 1 1 2.2 3.2l-.7.4c.2.4.3.9.4 1.3.05.4.15.7.25 1.1H21a2 2 0 1 1 0 4h-.1c-.1.4-.2.8-.3 1.1z" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button class="icon-btn" type="button" aria-label="Pomoc" title="Pomoc">
          <!-- improved help (question circle) icon (feather style) -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M9.09 9a3 3 0 1 1 5.82 1c0 2-3 3-3 3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M12 17h.01" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <main class="game-shell">
      <div id="board" class="board" aria-label="Plansza gry"></div>

      <div class="keyboard" aria-label="Klawiatura">
        <div class="keyboard-row">
          <button class="key">Q</button>
          <button class="key">W</button>
          <button class="key">E</button>
          <button class="key">R</button>
          <button class="key">T</button>
          <button class="key">Y</button>
          <button class="key">U</button>
          <button class="key">I</button>
          <button class="key">O</button>
          <button class="key">P</button>
        </div>

        <div class="keyboard-row">
          <button class="key">A</button>
          <button class="key">S</button>
          <button class="key">D</button>
          <button class="key">F</button>
          <button class="key">G</button>
          <button class="key">H</button>
          <button class="key">J</button>
          <button class="key">K</button>
          <button class="key">L</button>
        </div>

        <div class="keyboard-row">
          <button class="key backspace">⌫</button>
          <button class="key">Z</button>
          <button class="key">X</button>
          <button class="key">C</button>
          <button class="key">V</button>
          <button class="key">B</button>
          <button class="key">N</button>
          <button class="key">M</button>
          <button class="key enter">Enter</button>
        </div>

        <div class="keyboard-row extra-row">
          <button class="key extra">Ą</button>
          <button class="key extra">Ć</button>
          <button class="key extra">Ę</button>
          <button class="key extra">Ł</button>
          <button class="key extra">Ń</button>
          <button class="key extra">Ó</button>
          <button class="key extra">Ś</button>
          <button class="key extra">Ź</button>
          <button class="key extra">Ż</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
