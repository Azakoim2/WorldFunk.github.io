<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Funk – 6 liter</title>
  <style>
    :root {
      --bg: #121213;
      --tile-border: #3a3a3c;
      --tile-border-filled: #565758;
      --correct: #6aaa64;
      --present: #c9b458;
      --absent: #3a3a3c;
      --key-bg: #818384;
      --key-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: white;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    h1 {
      font-size: 1.8rem;
      margin: 12px 0 20px;
      letter-spacing: 2px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 28px;
    }

    .row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    .tile {
      width: 56px;
      height: 56px;
      border: 2px solid var(--tile-border);
      border-radius: 8px;
      font-size: 1.8rem;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }

    .tile.filled { border-color: var(--tile-border-filled); }
    .tile.correct { background: var(--correct); border-color: var(--correct); }
    .tile.present { background: var(--present); border-color: var(--present); }
    .tile.absent  { background: var(--absent);  border-color: var(--absent); }

    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 520px;
      width: 100%;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key {
      height: 52px;
      min-width: 38px;
      padding: 0 6px;
      border-radius: 6px;
      background: var(--key-bg);
      color: var(--key-text);
      font-weight: 700;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .key.wide { min-width: 62px; font-size: 0.75rem; }
    .key.correct { background: var(--correct); }
    .key.present { background: var(--present); }
    .key.absent  { background: var(--absent); }

    .message {
      margin-top: 18px;
      font-size: 1.1rem;
      height: 28px;
      text-align: center;
      color: #ff6b6b;
    }
  </style>
</head>
<body>

  <h1>WORD FUNK</h1>

  <div class="board" id="board"></div>
  <div class="keyboard" id="keyboard"></div>
  <div class="message" id="message"></div>

  <script>
    // === LISTA HASEŁ (ładne, popularne słowa) ===
    const SECRET_WORDS = [
      "borsuk","delfin","gepard","jaguar","kangur","krolik","papuga","tygrys",
      "daniel","piesek","szczur","fretka","chomik","lisica","alpaka","bazant",
      "bielik","bocian","czapla","kaczka","swinia","jablko","morela","wisnia",
      "malina","ogorek","cebula","sernik","ciasto","jogurt","salata","boczek",
      "brokul","fasola","kompot","lukier","orzech","pieprz","pierog","pstrag",
      "bramka","boisko","trener","sedzia","plywak","kolarz","bokser","siatka",
      "koszyk","puchar","zespol","atleta","ciezar","finisz","hantle","podium",
      "serwis","sprint","tyczka","wioslo","wyscig","zawody","krakow","gdansk",
      "poznan","lublin","kielce","szkola","laguna","marina","oltarz","ratusz",
      "stacja","lekarz","kelner","rolnik","malarz","pisarz","gitara","trabka",
      "barman","geolog","murarz","kurtka","sweter","czapka","szalik","plecak",
      "chusta","szorty","tunika","zakiet","pociag","statek","skuter","czarny",
      "granat","lekcja","zeszyt","olowek","globus","fizyka","chemia","dyplom",
      "wyklad","laptop","tablet","strona","myszka","kamera","router","serwer",
      "antena","sensor","podroz","namiot","hostel","safari","wyjazd","taniec",
      "bilard","domino","puzzle","sudoku","szachy"
    ];

    // === DUŻA LISTA DOZWOLONYCH ZGADYWAŃ (prawdziwe 6-literowe słowa) ===
    // Tutaj możesz dokładać kolejne prawdziwe słowa
    const VALID_WORDS = new Set([
      ...SECRET_WORDS,
      // dodatkowe popularne 6-literowe słowa
      "abonent","absencja","absolut","abstrak","absurd","abyssal","acyklia",
      "adapter","adresat","adwokat","aerobik","afektat","afera","agentka",
      "agresja","akcent","akcept","akordy","aktorzy","aktual","akustyk",
      "alarmy","albumy","alergia","alfabet","algebra","alkohol","allegro",
      "almanac","alpaki","altana","aluzja","amator","amfora","amonia",
      "analiza","ananas","anatom","anegdota","angina","animacja","ankieta",
      "anomal","antena","antylopa","aparat","apetyt","aplauz","aposto",
      "apteka","arabes","arbuz","archeolog","archiw","arena","areszt",
      "argument","arkada","armata","aromat","arteria","artysta","asfalt",
      "aspekt","aster","astma","asystent","atakuj","atelier","atmosfera",
      "atrament","aukcja","autobi","autobus","automat","awans","awaria",
      "babcia","baczyk","badacz","badanie","bagaznik","bajka","bajtla",
      "bakalie","balans","balcony","balet","balkon","balon","bambus",
      "banan","bandaz","banita","bankiet","baran","barman","basen",
      "batalia","bateria","bawełna","bazalt","bazylia","beczka","bęben",
      "benzyna","beret","bestia","beton","bezpie","biblioteka","biceps",
      "bilet","binarny","biolog","biurko","biznes","blacha","blask",
      "blekit","blizna","blokada","blondyn","bluzka","boczek","boczny",
      "bogaty","boisko","bokser","bolesny","bomba","bonus","borowik",
      "botanik","bramka","bratni","brelok","bronia","broszka","brudny",
      "brzeg","buchta","budowa","budynek","bufet","bukiet","bulion",
      "buntownik","burza","butelka","byczyna","bytosc"
      // ... możesz dokładać dalej
    ].map(w => w.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")));

    function normalize(str) {
      return str.toLowerCase()
        .replace(/ą/g,"a").replace(/ć/g,"c").replace(/ę/g,"e")
        .replace(/ł/g,"l").replace(/ń/g,"n").replace(/ó/g,"o")
        .replace(/ś/g,"s").replace(/ź/g,"z").replace(/ż/g,"z");
    }

    const secret = SECRET_WORDS[Math.floor(Math.random() * SECRET_WORDS.length)];
    const secretNorm = normalize(secret);

    let currentRow = 0;
    let currentTile = 0;
    let gameOver = false;
    let board = Array(6).fill().map(() => Array(6).fill(""));

    // Plansza
    const boardEl = document.getElementById("board");
    for (let r = 0; r < 6; r++) {
      const row = document.createElement("div");
      row.className = "row";
      for (let c = 0; c < 6; c++) {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.id = `tile-${r}-${c}`;
        row.appendChild(tile);
      }
      boardEl.appendChild(row);
    }

    // Klawiatura
    const keyboardLayout = [
      ["q","w","e","r","t","y","u","i","o","p"],
      ["a","s","d","f","g","h","j","k","l"],
      ["Enter","z","x","c","v","b","n","m","←"],
      ["ą","ć","ę","ł","ń","ó","ś","ź","ż"]
    ];

    const keyboardEl = document.getElementById("keyboard");
    const keyElements = {};

    keyboardLayout.forEach(rowKeys => {
      const row = document.createElement("div");
      row.className = "keyboard-row";
      rowKeys.forEach(k => {
        const key = document.createElement("button");
        key.className = "key" + (k === "Enter" || k === "←" ? " wide" : "");
        key.textContent = k === "←" ? "⌫" : k;
        key.dataset.key = k;
        key.addEventListener("click", () => handleKey(k));
        row.appendChild(key);
        keyElements[k] = key;
      });
      keyboardEl.appendChild(row);
    });

    function handleKey(key) {
      if (gameOver) return;
      if (key === "Enter") submitGuess();
      else if (key === "←") deleteLetter();
      else if (currentTile < 6) addLetter(key);
    }

    function addLetter(letter) {
      if (currentTile >= 6) return;
      board[currentRow][currentTile] = letter;
      const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
      tile.textContent = letter;
      tile.classList.add("filled");
      currentTile++;
    }

    function deleteLetter() {
      if (currentTile === 0) return;
      currentTile--;
      board[currentRow][currentTile] = "";
      const tile = document.getElementById(`tile-${currentRow}-${currentTile}`);
      tile.textContent = "";
      tile.classList.remove("filled");
    }

    function submitGuess() {
      if (currentTile < 6) {
        showMessage("Za mało liter!");
        return;
      }

      const guess = board[currentRow].join("");
      const guessNorm = normalize(guess);

      // Sprawdzenie czy słowo jest dozwolone
      if (!VALID_WORDS.has(guessNorm)) {
        showMessage("Słowo nie istnieje w słowniku!");
        return;
      }

      // Kolorowanie
      const secretArr = secretNorm.split("");
      const result = Array(6).fill("absent");
      const used = Array(6).fill(false);

      for (let i = 0; i < 6; i++) {
        if (guessNorm[i] === secretArr[i]) {
          result[i] = "correct";
          used[i] = true;
        }
      }

      for (let i = 0; i < 6; i++) {
        if (result[i] === "correct") continue;
        for (let j = 0; j < 6; j++) {
          if (!used[j] && guessNorm[i] === secretArr[j]) {
            result[i] = "present";
            used[j] = true;
            break;
          }
        }
      }

      for (let i = 0; i < 6; i++) {
        const tile = document.getElementById(`tile-${currentRow}-${i}`);
        tile.classList.add(result[i]);

        const letter = board[currentRow][i];
        const key = keyElements[letter] || keyElements[letter.toLowerCase()];
        if (key) {
          if (result[i] === "correct") {
            key.classList.remove("present", "absent");
            key.classList.add("correct");
          } else if (result[i]
